<body>
<div class="app"><aside class="sidebar"><div class="brand"><span class="brand-mark">S</span><span>Stephan's Music</span></div><nav class="nav" id="nav"><button class="active" data-page="home"><span class="ico">⌂</span><span class="label">Home</span></button><button data-page="search"><span class="ico">⌕</span><span class="label">Search</span></button><button data-page="liked"><span class="ico">♥</span><span class="label">Liked Songs</span></button></nav><div class="side-note" id="sideStatus">Public music collection<br>Made with ♡ by Stephan</div></aside>
<main><header class="topbar"><button class="round-btn" id="backBtn" aria-label="Back">‹</button><button class="round-btn" id="forwardBtn" aria-label="Forward">›</button><div class="searchbox"><span>⌕</span><input id="searchInput" placeholder="What do you want to listen to?" autocomplete="off"></div><button class="btn ghost" id="configBtn">Connect</button><button class="btn green hidden" id="addBtn">＋ Add music</button><button class="btn ghost" id="loginBtn">Owner login</button></header><section class="page" id="pageContent"></section></main></div>
<footer>Stephan's Music App · Public listening, owner-managed catalogue. Only upload music and artwork you have permission to share.</footer>
<div class="player" id="player"><div class="now"><div class="mini-cover" id="playerCover">S</div><div class="now-meta"><strong id="playerTitle">Choose a song</strong><span id="playerArtist">Stephan's Music</span></div></div><div class="controls"><div class="control-row"><button class="control" id="prevBtn" aria-label="Previous">⏮</button><button class="control main" id="playBtn" aria-label="Play">▶</button><button class="control" id="nextBtn" aria-label="Next">⏭</button><button class="control" id="fullBtn" aria-label="Fullscreen player">⛶</button></div><div class="progress-row"><span id="currentTime">0:00</span><div class="progress" id="progressBar" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-fill" id="progressFill"></div></div><span id="duration">0:00</span></div></div><div class="volume">🔊 <input id="volume" type="range" min="0" max="1" step=".01" value=".85" aria-label="Volume"></div></div>
<div class="modal-backdrop hidden" id="modalBackdrop"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="full-player hidden" id="fullPlayer"><div class="full-top"><button class="btn ghost" id="closeFull">⌄ Close player</button><span class="badge">NOW PLAYING</span><button class="btn ghost" id="fullCreditsBtn">Credits</button></div><div class="full-main" id="fullMain"></div></div>
<div class="toast hidden" id="toast"></div><audio id="audio" preload="metadata"></audio>
<script>
(()=>{'use strict';
// Public browser configuration: fill these with the Supabase Project URL and publishable key before publishing to GitHub Pages. Never put a service-role/secret key here.
const DEFAULT_SUPABASE_URL='https://nchorywkxgdzsauyqbts.supabase.co';
const DEFAULT_SUPABASE_KEY='sb_publishable_NtHRvJonSi_mibe0wB3iNQ_t2umU2hg';
const HAS_BUILTIN_CONFIG=DEFAULT_SUPABASE_URL.startsWith('https://')&&DEFAULT_SUPABASE_URL.endsWith('.supabase.co')&&DEFAULT_SUPABASE_KEY&& !DEFAULT_SUPABASE_KEY.startsWith('PASTE_');
const $=id=>document.getElementById(id);const uid=()=>crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const arr=x=>Array.isArray(x)?x:[];const fmt=n=>{if(!Number.isFinite(n))return'0:00';return Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0')};const initials=s=>String(s||'?').trim().slice(0,1).toUpperCase();const nowISO=()=>new Date().toISOString();
const blank=()=>({artists:[],releases:[],tracks:[],events:[],features:[],playlists:[],groups:[]});
const state={data:blank(),page:'home',detail:null,search:'',session:null,client:null,config:{url:'',key:''},owner:false,loading:false,liked:new Set(),recentArtists:(()=>{try{return JSON.parse(localStorage.getItem('sma_recent_artists')||'[]')}catch{return[]}})(),queue:[],queueIndex:-1,localAudio:new Map(),localCovers:new Map(),back:[],forward:[],unsavedDemo:false};const audio=$('audio');let toastTimer;
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),3600)}
function isOwner(){return !!state.owner&&!!state.session}function artists(){return arr(state.data.artists)}function releases(){return arr(state.data.releases)}function tracks(){return arr(state.data.tracks)}function events(){return arr(state.data.events)}function publishedReleases(){return releases().filter(r=>r.status!=='scheduled'||(r.publishAt&&new Date(r.publishAt)<=new Date()))}function publicTracks(){const pub=new Set(publishedReleases().map(r=>r.id));return tracks().filter(t=>!t.releaseId||pub.has(t.releaseId))}function artistBy(id){return artists().find(a=>a.id===id)}function releaseBy(id){return releases().find(r=>r.id===id)}function trackBy(id){return tracks().find(t=>t.id===id)}function eventArtist(e){return artistBy(e.artistId)}function trackArtists(t){return arr(t.artistIds).map(artistBy).filter(Boolean)}function releaseArtists(r){return arr(r.artistIds).map(artistBy).filter(Boolean)}function trackName(t){return trackArtists(t).map(a=>a.name).join(', ')||t.artistText||'Unknown artist'}function releaseName(r){return releaseArtists(r).map(a=>a.name).join(' • ')||r.artistText||'Unknown artist'}function songsForArtist(id){return publicTracks().filter(t=>arr(t.artistIds).includes(id)||t.artistId===id)}function releasesForArtist(id){return publishedReleases().filter(r=>arr(r.artistIds).includes(id))}function artistCover(a){if(a?.photoUrl)return a.photoUrl;const rs=releasesForArtist(a?.id).sort((x,y)=>String(y.date||'').localeCompare(String(x.date||'')));return rs[0]?.coverUrl||''}function art(url,label,round=false){return url?`<img src="${esc(url)}" alt="${esc(label||'Artwork')}">`:esc(initials(label));}function coverHTML(t,large=false){const url=t?.coverUrl||releaseBy(t?.releaseId)?.coverUrl||'';return url?`<img src="${esc(url)}" alt="${esc(t?.title||'Cover')}">`:esc(initials(t?.title||'S'))}function isScheduled(r){return r.status==='scheduled'&&(!r.publishAt||new Date(r.publishAt)>new Date())}
function demoSeed(){if(state.data.artists.length||state.data.tracks.length)return;const a={id:'artist-stephan',name:'Stephan D',bio:'Welcome to Stephan’s Music — a home for songs, collaborations, and creative projects.',photoUrl:'',website:'',groupIds:[],radioTrackIds:[]};state.data.artists.push(a);state.data.groups=[];state.data.releases=[];state.data.tracks=[];}
function getCurrent(){return trackBy(state.queue[state.queueIndex])||null}function ownerControls(){return isOwner()?'<button class="btn tiny" data-action="edit-track" data-id="'+esc(getCurrent()?.id||'')+'">Edit song</button>':''}
function empty(title,body,adminAction=''){return `<div class="empty"><strong>${esc(title)}</strong>${esc(body)}${adminAction&&isOwner()?`<p style="margin-top:14px"><button class="btn green" data-action="${adminAction}">＋ Add one</button></p>`:''}</div>`}
function section(title,sub=''){return `<div class="section-head"><h2>${esc(title)}</h2>${sub?`<span class="subtle">${esc(sub)}</span>`:''}</div>`}
function trackRow(t,i=0,artistId=null){const liked=state.liked.has(t.id);const playAction=artistId?'play-artist-song':'play';return `<div class="track-row"><div class="track-num">${i+1}</div><div><div class="track-title">${esc(t.title)}</div><div class="track-artist">${esc(trackName(t))}${t.releaseId&&releaseBy(t.releaseId)?' · '+esc(releaseBy(t.releaseId).title):''}</div></div><div class="track-controls"><button class="btn tiny green" data-action="${playAction}" data-id="${esc(t.id)}"${artistId?` data-artist-id="${esc(artistId)}"`:''}>▶</button><button class="btn tiny ghost" data-action="credits" data-id="${esc(t.id)}">ⓘ</button><button class="btn tiny ghost" data-action="like" data-id="${esc(t.id)}">${liked?'♥':'♡'}</button>${isOwner()?`<button class="btn tiny ghost" data-action="edit-track" data-id="${esc(t.id)}">Edit</button><button class="btn tiny red" data-action="delete-track" data-id="${esc(t.id)}">Delete</button>`:''}</div></div>`}
function trackCard(t){return `<article class="card"><div class="cover">${coverHTML(t)}</div><h3>${esc(t.title)}</h3><p>${esc(trackName(t))}<br>${esc(t.releaseId&&releaseBy(t.releaseId)?releaseBy(t.releaseId).type:(t.type||'Song'))}</p><div class="card-actions"><button class="btn tiny green" data-action="play" data-id="${esc(t.id)}">▶ Play</button><button class="btn tiny ghost" data-action="credits" data-id="${esc(t.id)}">Credits</button></div></article>`}
function releaseCard(r){const rsTracks=tracks().filter(t=>t.releaseId===r.id);return `<article class="card"><div class="cover">${r.coverUrl?`<img src="${esc(r.coverUrl)}" alt="${esc(r.title)} cover">`:esc(initials(r.title))}</div><h3>${esc(r.title)}</h3><p>${esc(r.type)} · ${esc(releaseName(r))}<br>${rsTracks.length} track${rsTracks.length===1?'':'s'}${r.isLatest?' · Latest release':''}</p><div class="card-actions"><button class="btn tiny green" data-action="release" data-id="${esc(r.id)}">Open</button>${isOwner()?`<button class="btn tiny ghost" data-action="edit-release" data-id="${esc(r.id)}">Edit</button>`:''}</div></article>`}
function artistCard(a){const count=songsForArtist(a.id).length;const pic=artistCover(a);return `<article class="card"><div class="avatar">${pic?`<img src="${esc(pic)}" alt="${esc(a.name)}">`:esc(initials(a.name))}</div><h3>${esc(a.name)}${a.isGroup?' · Group':''}</h3><p>${count} song${count===1?'':'s'}${arr(a.groupIds).length?`<br>Group badge(s): ${arr(a.groupIds).length}`:''}</p><div class="card-actions"><button class="btn tiny green" data-action="artist" data-id="${esc(a.id)}">View artist</button>${isOwner()?`<button class="btn tiny ghost" data-action="edit-artist" data-id="${esc(a.id)}">Edit</button>`:''}</div></article>`}
function markRecentArtist(id){if(!id)return;state.recentArtists=[id,...arr(state.recentArtists).filter(x=>x!==id)].slice(0,12);try{localStorage.setItem('sma_recent_artists',JSON.stringify(state.recentArtists))}catch{}}function artistRadioTracks(a){const own=songsForArtist(a.id);if(!own.length)return[];const ownIds=new Set(own.map(t=>t.id));const releaseIds=new Set(own.map(t=>t.releaseId).filter(Boolean));const collaboratorIds=new Set(own.flatMap(t=>arr(t.artistIds)).filter(id=>id!==a.id));let candidates=publicTracks().filter(t=>!ownIds.has(t.id)).map(t=>{let score=0;if(t.releaseId&&releaseIds.has(t.releaseId))score+=5;for(const id of arr(t.artistIds))if(collaboratorIds.has(id))score+=3;if(arr(t.artistIds).includes(a.id))score+=1;return{t,score}}).sort((x,y)=>y.score-x.score);const selected=candidates.filter(x=>x.score>0).map(x=>x.t);for(const x of candidates)if(selected.length<8&&!selected.includes(x.t))selected.push(x.t);return selected.slice(0,8)}function openArtistRadio(id){const a=artistBy(id);if(!a)return;const own=songsForArtist(id);if(!own.length){toast('This artist has no songs yet, so their radio is empty.');return}go('playlist','artist-radio-'+id)}
function homePage(){const recent=arr(state.recentArtists).map(artistBy).filter(Boolean);const featuredIds=arr(state.data.featuredArtistIds);const featured=featuredIds.map(artistBy).filter(Boolean);const popularIds=arr(state.data.popularTrackIds);let popular=popularIds.map(trackBy).filter(t=>t&&publicTracks().some(p=>p.id===t.id));if(!popular.length)popular=publicTracks().slice(0,5);return `<div class="hero"><div><p class="eyebrow">WELCOME BACK</p><h1>Your music.</h1><p>Pick up where you left off, discover featured artists, and play something you love.</p></div>${isOwner()?'<button class="btn ghost" data-action="home-settings">⚙ Customize home</button>':''}</div>${section('Popular songs','Top picks')}${isOwner()?'<p class="subtle">Choose up to five songs for this section.</p>':''}<div class="track-list">${popular.slice(0,5).map(trackRow).join('')||'<p class="subtle">Published songs will appear here.</p>'}</div>${isOwner()?'<button class="btn tiny ghost" data-action="popular-settings">Edit popular songs</button>':''}${section('Recently played artists','Your recent visits')}${recent.length?`<div class="grid">${recent.slice(0,6).map(artistCard).join('')}</div>`:'<p class="subtle">Artists you open will show up here.</p>'}${section('Featured artists','Chosen by Stephan')}${featured.length?`<div class="grid">${featured.map(artistCard).join('')}</div>`:'<p class="subtle">No featured artists selected yet.</p>'}`}
function searchPage(){const q=state.search.trim().toLowerCase();if(!q)return `<p class="eyebrow">FIND SOMETHING TO PLAY</p><h1>Search</h1><p class="subtle">Search for an artist, song, or release. Results appear as you type.</p>`;const ts=publicTracks().filter(t=>(t.title+' '+trackName(t)).toLowerCase().includes(q));const as=artists().filter(a=>a.name.toLowerCase().includes(q));const rs=publishedReleases().filter(r=>(r.title+' '+releaseName(r)).toLowerCase().includes(q));return `<p class="eyebrow">SEARCH RESULTS</p><h1>Search</h1>${section('Artists',`${as.length} results`)}<div class="grid">${as.map(artistCard).join('')||'<p class="subtle">No matching artists.</p>'}</div>${section('Songs',`${ts.length} results`)}<div class="track-list">${ts.map(trackRow).join('')||'<p class="subtle">No matching songs.</p>'}</div>${section('Releases',`${rs.length} results`)}<div class="grid">${rs.map(releaseCard).join('')||'<p class="subtle">No matching releases.</p>'}</div>`}

function releasesPage(){return `<p class="eyebrow">SINGLES, EPS, ALBUMS & MORE</p><h1>Releases</h1>${isOwner()?'<button class="btn green" data-action="new-release">＋ Create release</button>':''}<div class="grid" style="margin-top:18px">${publishedReleases().slice().reverse().map(releaseCard).join('')||empty('No releases yet','Create a release to group songs together.','new-release')}</div>`}
function artistPage(){const a=artistBy(state.detail);if(!a)return `<h1>Artist not found</h1>`;markRecentArtist(a.id);const ts=songsForArtist(a.id);const rs=releasesForArtist(a.id).slice().sort((x,y)=>String(y.date||'').localeCompare(String(x.date||'')));const groupIds=arr(a.groupIds);const ev=events().filter(e=>e.artistId===a.id);const upcoming=releases().filter(r=>arr(r.artistIds).includes(a.id)&&isScheduled(r));const features=arr(state.data.features).filter(f=>f.artistId===a.id);const featuredIn=publicTracks().filter(t=>arr(t.artistIds)[0]!==a.id&&arr(t.artistIds).slice(1).includes(a.id)&&t.releaseId).map(t=>releaseBy(t.releaseId)).filter((r,i,all)=>r&& !arr(r.artistIds).includes(a.id)&&all.findIndex(x=>x.id===r.id)===i&&publishedReleases().some(pr=>pr.id===r.id));const pic=artistCover(a);const groupNotice=groupIds.length?`<div class="notice">Group memberships: ${groupIds.map(id=>{const g=state.data.groups.find(x=>x.id===id);return g?`<button class="link" data-action="group" data-id="${esc(g.id)}">${esc(g.name)}</button>`:''}).join(' · ')}</div>`:'';const radio=artistRadioTracks(a);return `<div class="artist-hero"><div class="artist-avatar">${pic?`<img src="${esc(pic)}" alt="${esc(a.name)}">`:esc(initials(a.name))}</div><div><p class="eyebrow">${a.isGroup?'ARTIST GROUP':'ARTIST PROFILE'}</p><h1>${esc(a.name)}</h1><p>${ts.length} published song${ts.length===1?'':'s'}</p>${a.linkUrl?`<p><a href="${esc(a.linkUrl)}" target="_blank" rel="noopener" style="color:var(--mint)">${esc(a.linkLabel||'↗ Official link')} ↗</a></p>`:''}${isOwner()?`<button class="btn tiny ghost" data-action="edit-artist" data-id="${esc(a.id)}">Edit artist</button> <button class="btn tiny ghost" data-action="feature-artist" data-id="${esc(a.id)}">Feature a song/release</button> <button class="btn tiny red" data-action="delete-artist" data-id="${esc(a.id)}">Delete artist</button>`:''}</div></div>${a.bio?`<p style="max-width:760px;line-height:1.7;color:#d0d8d1">${esc(a.bio)}</p>`:''}${groupNotice}${features.map(f=>{const item=f.kind==='track'?trackBy(f.itemId):releaseBy(f.itemId);return item?`<div class="feature-card"><p class="eyebrow">${esc(f.message||'ARTIST PICK')}</p><h3>${esc(item.title)}</h3><p>${esc(f.note||'CHECK THIS OUT')} — Posted by ${esc(artistBy(f.artistId)?.name||a.name)}</p><button class="btn tiny green" data-action="${f.kind==='track'?'play':'release'}" data-id="${esc(item.id)}">${f.kind==='track'?'▶ Play':'Open release'}</button>${isOwner()?` <button class="btn tiny red" data-action="delete-feature" data-id="${esc(f.id)}">Remove pick</button>`:''}</div>`:''}).join('')}${upcoming.length?`${section('Upcoming releases')}<div class="grid">${upcoming.map(r=>`<div class="event-card"><h3>${esc(r.title)}</h3><p>${r.publishAt?'Releasing '+new Date(r.publishAt).toLocaleDateString():'Upcoming release'}</p>${isOwner()?`<button class="btn tiny ghost" data-action="edit-release" data-id="${esc(r.id)}">Edit release</button>`:''}</div>`).join('')}</div>`:''}${section('Popular songs')}<div class="track-list">${ts.slice(0,5).map((t,i)=>trackRow(t,i,a.id)).join('')||'<p class="subtle">No published songs yet.</p>'}</div>${ts.length>=11?`<div class="tools"><button class="btn ghost" data-action="playlist-artist" data-id="${esc(a.id)}">♫ This is ${esc(a.name)} · ${ts.length} songs</button></div>`:''}${section('Releases')}<div class="grid">${rs.filter(r=>!isScheduled(r)).map(r=>releaseCard(r)).join('')||'<p class="subtle">No published releases yet.</p>'}</div>${featuredIn.length?`${section('Featured in…','Releases with this artist as a featured artist')}<div class="grid">${featuredIn.map(releaseCard).join('')}</div>`:''}${ts.length?`<div class="tools"><button class="btn ghost" data-action="open-radio" data-id="${esc(a.id)}">▶ Open ${esc(a.name)} Radio${radio.length?' · '+radio.length+' songs':''}</button><span class="small-note">Similar songs based on shared releases and collaborators</span></div>`:'<p class="subtle">Radio is empty until this artist has songs.</p>'}${ev.length?`${section('Live events')} ${ev.map(eventCard).join('')}`:''}${isOwner()?`<div class="tools"><button class="btn ghost" data-action="new-event" data-artist="${esc(a.id)}">＋ Live event</button><button class="btn ghost" data-action="new-release" data-artist="${esc(a.id)}">＋ Release</button></div>`:''}`}
function releasePage(){const r=releaseBy(state.detail);if(!r)return '<h1>Release not found</h1>';const ts=tracks().filter(t=>t.releaseId===r.id);return `<p class="eyebrow">${esc(r.type)} RELEASE</p><div class="release"><div class="release-cover">${r.coverUrl?`<img src="${esc(r.coverUrl)}" alt="${esc(r.title)} cover">`:esc(initials(r.title))}</div><div><p class="eyebrow">${r.isLatest?'LATEST RELEASE':esc(r.type.toUpperCase())}</p><h1>${esc(r.title)}</h1><p>By ${arr(r.artistIds).map(id=>{const a=artistBy(id);return a?`<button class="link" data-action="artist" data-id="${esc(id)}">${esc(a.name)}</button>`:''}).join(' · ')||esc(r.artistText||'Unknown artist')}</p><p>${esc(r.date||'Release date not set')} · ${ts.length} track${ts.length===1?'':'s'}</p>${r.description?`<p>${esc(r.description)}</p>`:''}<div class="tools"><button class="btn green" data-action="play-release" data-id="${esc(r.id)}">▶ Play release</button>${isOwner()?`<button class="btn ghost" data-action="edit-release" data-id="${esc(r.id)}">Edit release</button><button class="btn red" data-action="delete-release" data-id="${esc(r.id)}">Delete</button>`:''}</div></div></div>${section('Tracklist')}${ts.length?`<div class="track-list">${ts.map(trackRow).join('')}</div>`:empty('No tracks in this release','Edit this release to add songs.','edit-release')}${isOwner()?`<button class="btn ghost" data-action="new-track" data-release="${esc(r.id)}">＋ Add song to release</button>`:''}`}
function playlistsPage(){const generated=artists().map(a=>({id:'artistlist-'+a.id,title:'This is '+a.name,desc:'All '+a.name+' songs in release order',ids:songsForArtist(a.id).map(t=>t.id),generated:true})).filter(p=>p.ids.length>10);const manual=arr(state.data.playlists);return `<p class="eyebrow">YOUR MIXES</p><h1>Playlists</h1><p class="subtle">Artist Radio playlists are curated by the owner; artist collections with 11+ songs are generated automatically.</p>${section('Artist collections')}${generated.map(p=>`<div class="event-card"><h3>${esc(p.title)}</h3><p>${p.ids.length} songs</p><button class="btn tiny green" data-action="playlist" data-id="${esc(p.id)}">Open playlist</button></div>`).join('')||'<p class="subtle">Artist collections appear once an artist has more than 10 published songs.</p>'}${section('Custom playlists')}${manual.map(p=>`<div class="event-card"><h3>${esc(p.name)}</h3><p>${arr(p.trackIds).length} songs</p><button class="btn tiny green" data-action="playlist" data-id="${esc(p.id)}">Open playlist</button>${isOwner()?` <button class="btn tiny ghost" data-action="edit-playlist" data-id="${esc(p.id)}">Edit</button>`:''}</div>`).join('')||'<p class="subtle">No custom playlists yet.</p>'}${isOwner()?'<button class="btn green" data-action="new-playlist">＋ Create playlist</button>':''}`}
function playlistPage(){const id=state.detail;let p=arr(state.data.playlists).find(x=>x.id===id);let title=p?.name,ids=arr(p?.trackIds);if(String(id).startsWith('artistlist-')){const a=artistBy(String(id).slice(11));title='This is '+(a?.name||'Artist');ids=songsForArtist(a?.id).map(t=>t.id)}else if(String(id).startsWith('artist-radio-')){const a=artistBy(String(id).slice(13));title=(a?.name||'Artist')+' Radio';ids=artistRadioTracks(a||{id:''}).map(t=>t.id)}const ts=ids.map(trackBy).filter(t=>t&&publicTracks().some(x=>x.id===t.id));return `<p class="eyebrow">PLAYLIST</p><h1>${esc(title||'Playlist')}</h1><p class="subtle">${ts.length} songs</p>${String(id).startsWith('artist-radio-')?'<p class="subtle">Automatically selected from shared releases and collaborators. No owner curation required.</p>':''}<div class="tools"><button class="btn green" data-action="play-list" data-ids="${esc(JSON.stringify(ts.map(t=>t.id)))}">▶ Play playlist</button></div><div class="track-list">${ts.map(trackRow).join('')||'<p class="subtle">No songs in this playlist yet.</p>'}</div>`}

function eventCard(e){const a=eventArtist(e);return `<div class="event-card"><p class="eyebrow">LIVE EVENT${a?' · '+esc(a.name.toUpperCase()):''}</p><h3>${esc(e.title)}</h3><p>${esc(e.description||'More details coming soon.')}${e.date?'<br>'+esc(e.date):''}${e.url?'<br><a style="color:var(--mint)" href="'+esc(e.url)+'" target="_blank" rel="noopener">Event link ↗</a>':''}</p>${isOwner()?`<button class="btn tiny red" data-action="delete-event" data-id="${esc(e.id)}">Delete event</button>`:''}</div>`}

function homeSettings(){if(!requireOwner())return;const current=arr(state.data.featuredArtistIds);modalForm('Customize home','Choose featured artists and set the exact order they appear in. Recently played artists are automatic.',multi('Featured artists','featuredArtistIds',artists().map(a=>({id:a.id,name:a.name})),current),'Save home');$('editForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);state.data.featuredArtistIds=fd.getAll('featuredArtistIds');await saveCloud();closeModal();render();toast('Featured artists updated.')};}function popularSettings(){if(!requireOwner())return;modalForm('Choose popular songs','Choose up to five songs to show on the home page.',multi('Popular songs','popularTrackIds',publicTracks().map(t=>({id:t.id,name:t.title+' — '+trackName(t)})),arr(state.data.popularTrackIds).length?arr(state.data.popularTrackIds):publicTracks().slice(0,5).map(t=>t.id)),'Save popular songs');$('editForm').onsubmit=async e=>{e.preventDefault();state.data.popularTrackIds=Array.from(new FormData(e.target).getAll('popularTrackIds')).slice(0,5);await saveCloud();closeModal();render();toast('Popular songs updated.')};}
function adminPage(){return `<p class="eyebrow">OWNER ONLY</p><h1>Owner Studio</h1>${!state.client?`<div class="notice">Connect this app to your Supabase project first. The app can preview locally, but permanent public storage requires the backend.</div><button class="btn green" data-action="config">Connect Supabase</button>`:''}${state.client&&!state.session?`<div class="notice">Sign in with the owner account created for your Supabase project. Visitors can browse without signing in.</div><button class="btn green" data-action="login">Owner login</button>`:''}${state.session&&!isOwner()?`<div class="notice">You are signed in, but this account is not the configured owner. Editing is disabled.</div><button class="btn ghost" data-action="logout">Sign out</button>`:''}${isOwner()?`<div class="notice">You are signed in as the owner. Changes save to the shared database; audio and artwork upload to Supabase Storage.</div><div class="grid"><div class="card"><h3>Artists</h3><p>${artists().length} profiles</p><button class="btn green" data-action="new-artist">＋ Add artist</button></div><div class="card"><h3>Releases</h3><p>${releases().length} total releases</p><button class="btn green" data-action="new-release">＋ Create release</button></div><div class="card"><h3>Songs</h3><p>${tracks().length} tracks in catalogue</p><button class="btn green" data-action="new-track">＋ Upload song</button></div><div class="card"><h3>Groups</h3><p>${arr(state.data.groups).length} artist groups</p><button class="btn green" data-action="new-group">＋ Create group</button></div><div class="card"><h3>Playlists</h3><p>${arr(state.data.playlists).length} custom playlists</p><button class="btn green" data-action="new-playlist">＋ Create playlist</button></div><div class="card"><h3>Features</h3><p>${arr(state.data.features).length} artist picks</p><button class="btn green" data-action="feature-artist">＋ Feature a pick</button></div></div><div class="tools"><button class="btn ghost" data-action="export-json">Export catalogue JSON</button><button class="btn ghost" data-action="logout">Sign out</button></div>`:''}<div class="notice">Security note: the database policies—not the buttons in this page—control who can change public content. Never put a Supabase service-role key in this HTML.</div>`}
function render(){document.querySelectorAll('#nav [data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===(state.page==='artist'||state.page==='release'||state.page==='playlist'?'home':state.page)));$('configBtn').classList.toggle('hidden',HAS_BUILTIN_CONFIG);$('addBtn').classList.toggle('hidden',!isOwner());$('loginBtn').textContent=isOwner()?'Owner: signed in':state.session?'Sign out':'Owner login';$('sideStatus').innerHTML=state.client?(isOwner()?'Owner mode active<br>Changes save online':'Connected public catalogue<br>Made with ♡ by Stephan'):'Preview mode<br>Connect Supabase to go public';const pages={home:homePage,search:searchPage,artists:artistsPage,releases:releasesPage,artist:artistPage,release:releasePage,playlists:playlistsPage,playlist:playlistPage,upcoming:upcomingPage,events:eventsPage,admin:adminPage,liked:likedPage};$('pageContent').innerHTML=(pages[state.page]||homePage)();updatePlayer();if(!$('fullPlayer').classList.contains('hidden'))renderFullPlayer()}
function likedPage(){const ts=publicTracks().filter(t=>state.liked.has(t.id));return `<p class="eyebrow">YOUR FAVORITES</p><h1>Liked Songs ♥</h1><div class="track-list">${ts.map(trackRow).join('')||empty('No liked songs yet','Tap the heart beside a track to save it on this device.')}</div>`}
function go(page,detail=null){if(state.page!==page||state.detail!==detail)state.back.push({page:state.page,detail:state.detail});state.forward=[];state.page=page;state.detail=detail;render();window.scrollTo(0,0)}function back(){const p=state.back.pop();if(p){state.forward.push({page:state.page,detail:state.detail});state.page=p.page;state.detail=p.detail;render()}else go('home')}function forward(){const p=state.forward.pop();if(p){state.back.push({page:state.page,detail:state.detail});state.page=p.page;state.detail=p.detail;render()}}
function coverURL(t){return t?.coverUrl||releaseBy(t?.releaseId)?.coverUrl||''}function updateMediaSession(t){if(!('mediaSession' in navigator)||typeof MediaMetadata==='undefined')return;try{if(!t){navigator.mediaSession.metadata=null;return}const artistsText=trackName(t)||'Stephan’s Music';const artwork=coverURL(t);const artworkList=artwork?[{src:artwork,sizes:'512x512',type:'image/jpeg'}]:[];navigator.mediaSession.metadata=new MediaMetadata({title:t.title||'Unknown song',artist:artistsText,album:releaseBy(t.releaseId)?.title||'Stephan’s Music',artwork:artworkList});navigator.mediaSession.playbackState=audio.paused?'paused':'playing';for(const [key,handler] of Object.entries({play:()=>togglePlay(),pause:()=>togglePlay(),previoustrack:()=>step(-1),nexttrack:()=>step(1),seekbackward:()=>{audio.currentTime=Math.max(0,audio.currentTime-10)},seekforward:()=>{audio.currentTime=Math.min(audio.duration||Infinity,audio.currentTime+10)}})){try{navigator.mediaSession.setActionHandler(key,handler)}catch{}}}catch(e){console.debug('Media Session metadata unavailable',e)}}function updatePlayer(){const t=getCurrent();$('playerTitle').textContent=t?.title||'Choose a song';$('playerArtist').textContent=t?trackName(t):'Stephan\'s Music';$('playerCover').innerHTML=t?coverHTML(t):'S';$('playBtn').textContent=audio.paused?'▶':'Ⅱ';updateMediaSession(t);if(!$('fullPlayer').classList.contains('hidden'))renderFullPlayer()}
function playIds(ids,start=0){state.queue=ids.filter(id=>trackBy(id)&&publicTracks().some(t=>t.id===id));if(!state.queue.length){toast('No playable songs in this selection yet.');return}state.queueIndex=Math.max(0,Math.min(start,state.queue.length-1));playCurrent()}
function playCurrent(){const t=getCurrent();if(!t)return;markRecentArtist(arr(t.artistIds)[0]);let url=state.localAudio.get(t.id)||t.audioUrl;if(!url){toast('This song has no uploaded audio file yet.');updatePlayer();return}audio.src=url;audio.play().then(updatePlayer).catch(()=>toast('Playback could not start. Tap Play again.'));updatePlayer()}
function togglePlay(){if(!getCurrent()){const t=publicTracks()[0];if(t)playIds([t.id]);else toast('No songs are published yet.');return}if(audio.paused){const t=getCurrent();audio.play().then(updatePlayer).catch(()=>toast('Playback could not start.'));}else audio.pause();updatePlayer()}
function step(dir){if(!state.queue.length)return;state.queueIndex=(state.queueIndex+dir+state.queue.length)%state.queue.length;playCurrent()}
function toggleLike(id){state.liked.has(id)?state.liked.delete(id):state.liked.add(id);render()}

function syncArtistOrderUI(){const f=$('editForm');if(!f)return;const boxes=[...f.querySelectorAll('input[name="artistIds"]')],hidden=f.querySelector('input[name="artistIdsOrder"]'),list=$('artistOrderList');if(!hidden||!list)return;let order=[];try{order=JSON.parse(hidden.value||'[]')}catch{}const checked=boxes.filter(b=>b.checked).map(b=>b.value);order=order.filter(id=>checked.includes(id));checked.forEach(id=>{if(!order.includes(id))order.push(id)});hidden.value=JSON.stringify(order);const names=new Map(boxes.map(b=>[b.value,b.closest('label')?.textContent?.trim()||b.value]));list.innerHTML=order.map((id,n)=>`<div class="track-row"><span class="track-num">${n+1}</span><strong>${esc(names.get(id)||id)}</strong><div class="track-controls"><button type="button" class="btn tiny ghost" data-multi-move="up" data-artist-id="${esc(id)}" ${n===0?'disabled':''}>↑</button><button type="button" class="btn tiny ghost" data-multi-move="down" data-artist-id="${esc(id)}" ${n===order.length-1?'disabled':''}>↓</button></div></div>`).join('')||'<p class="subtle">Select artists above, then arrange their order here.</p>'}function orderedArtistIds(fd){try{const ids=JSON.parse(fd.get('artistIdsOrder')||'[]');const checked=fd.getAll('artistIds');return ids.filter(id=>checked.includes(id)).concat(checked.filter(id=>!ids.includes(id)))}catch{return fd.getAll('artistIds')}}

function configModal(){modalForm('Connect Supabase','Enter your project URL and publishable (anon) key. These are intended for browser use when Row Level Security is configured.','', 'Connect');const f=$('editForm');f.innerHTML=`<div class="form-grid">${field('Project URL','url',state.config.url,'url',true,'placeholder="https://your-project.supabase.co" required')}${field('Publishable / anon key','key',state.config.key,'text',true,'required')}${field('Owner account email','email','','email',true,'placeholder="Used only for owner sign-in"')}</div><div class="modal-actions"><button type="button" class="btn ghost" id="cancelModal">Cancel</button><button type="submit" class="btn green">Connect</button></div><p class="small-note">Do not paste a service-role key here. The project URL and publishable key alone do not grant owner permissions.</p>`;$('cancelModal').onclick=closeModal;f.onsubmit=async e=>{e.preventDefault();const url=$('f_url').value.trim().replace(/\/$/,''),key=$('f_key').value.trim();if(!url.startsWith('https://')||!key){toast('Enter a valid Supabase URL and publishable key.');return}state.config={url,key};try{state.client=window.supabase.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});localStorage.setItem('sma_config',JSON.stringify(state.config));const {data:{session}}=await state.client.auth.getSession();state.session=session;state.owner=false;await loadCloud();if(session)await checkOwner();closeModal();render();toast('Supabase connected.');}catch(err){state.client=null;toast('Could not connect: '+err.message)}}}

let saveChain=Promise.resolve();function saveCloud(){if(!state.client||!isOwner()){state.unsavedDemo=true;return Promise.resolve(false)}const snapshot=JSON.parse(JSON.stringify(state.data));saveChain=saveChain.then(async()=>{const {data,error}=await state.client.from('music_catalogue').update({payload:snapshot,updated_at:nowISO()}).eq('id',1).select('id');if(error)throw error;if(!data?.length)throw new Error('No catalogue row updated. Confirm the owner ID and database policy.');state.unsavedDemo=false;return true}).catch(e=>{console.error(e);toast('Save failed: '+e.message);return false});return saveChain}
async function uploadFile(file,folder){if(!file)return '';if(!state.client||!isOwner())throw new Error('Connect and sign in as the owner before uploading files.');const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const ext=(file.name.split('.').pop()||'').toLowerCase();const mimeByExt={mp3:'audio/mpeg',m4a:'audio/mp4',mp4:'audio/mp4',wav:'audio/wav',aac:'audio/aac',aiff:'audio/aiff',aif:'audio/aiff',flac:'audio/flac',ogg:'audio/ogg',opus:'audio/ogg',webm:'audio/webm',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',webp:'image/webp',gif:'image/gif',avif:'image/avif'};const inferredMime=mimeByExt[ext]||'';const contentType=(folder==='audio'&&inferredMime.startsWith('audio/'))?inferredMime:(file.type&&file.type!=='application/octet-stream'?file.type:(inferredMime||'application/octet-stream'));const path=folder+'/'+Date.now()+'-'+uid().slice(0,8)+'-'+safe;const {error}=await state.client.storage.from('music-public').upload(path,file,{upsert:false,contentType});if(error){if(/mime type|content-type|not supported|unsupported/i.test(error.message||''))throw new Error('Supabase rejected this file type. WAV uploads are now sent as audio/wav; if this still appears, the Storage bucket settings need one quick update. ('+error.message+')');throw error}const {data}=state.client.storage.from('music-public').getPublicUrl(path);return data.publicUrl}

function featureForm(artistId=''){if(!requireOwner())return;const options=[['track','Song',...[]],['release','Release',...[]]];modalForm('Feature a song or release','Choose an artist pick, optional message, and the song/release to show on a profile.',selectField('Artist profile','artistId',[['','Choose artist'],...artists().map(a=>[a.id,a.name])],artistId,true)+selectField('Feature type','kind',[['track','Song'],['release','Release']],'track')+selectField('Song or release','itemId',[['','Choose after selecting type'],...publicTracks().map(t=>[t.id,'Song: '+t.title]),...publishedReleases().map(r=>[r.id,'Release: '+r.title])],'',true)+field('Label','message','Artist pick:','text',true)+field('Message','note','CHECK THIS OUT','text',true),'Add feature');$('editForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);const kind=String(fd.get('kind')),itemId=String(fd.get('itemId')),artistId=String(fd.get('artistId'));if(!artistId||!itemId){toast('Choose an artist and an item.');return}const obj={id:uid(),artistId,kind,itemId,message:String(fd.get('message')||'Artist pick:'),note:String(fd.get('note')||'')};state.data.features.push(obj);await saveCloud();closeModal();render();toast('Artist pick added.')};$('f_kind').onchange=()=>{const kind=$('f_kind').value;$('f_itemId').innerHTML=[['','Choose item'],...(kind==='track'?publicTracks().map(t=>[t.id,t.title]):publishedReleases().map(r=>[r.id,r.title]))].map(o=>`<option value="${esc(o[0])}">${esc(o[1])}</option>`).join('')}}
function creditsModal(t){if(!t)return;const artistsCredits=trackArtists(t);const rows=[];if(artistsCredits.length){rows.push({name:artistsCredits[0].name,role:'Main Artist'});artistsCredits.slice(1).forEach(a=>rows.push({name:a.name,role:'Featured Artist'}))}arr(t.credits).forEach(c=>rows.push(c));showModal(`<h2>Credits · ${esc(t.title)}</h2><p>All credited contributors</p><div class="credits-list">${rows.map(c=>`<div class="credit"><span>${esc(c.name)}</span><span>${esc(c.role)}</span></div>`).join('')||'<p class="subtle">No credits have been added yet.</p>'}</div><div class="modal-actions"><span class="small-note">Main artist is listed first; remaining artists are featured artists.</span><button class="btn green" id="closeCredits">Done</button></div>`);$('closeCredits').onclick=closeModal}
function renderFullPlayer(){const t=getCurrent();if(!t){$('fullMain').innerHTML='<div class="empty">Choose a song to open the fullscreen player.</div>';return}const a=trackArtists(t);const main=a[0];const credits=[...(a.length?[{name:a[0].name,role:'Main Artist'}]:[]),...a.slice(1).map(x=>({name:x.name,role:'Featured Artist'})),...arr(t.credits)];const ev=events().filter(e=>main&&e.artistId===main.id);const up=releases().filter(r=>main&&arr(r.artistIds).includes(main.id)&&isScheduled(r));$('fullMain').innerHTML=`<div class="full-art">${coverHTML(t)}</div><h1>${esc(t.title)}</h1><div class="full-artist">${a.map(x=>`<button class="link" data-action="artist" data-id="${esc(x.id)}">${esc(x.name)}</button>`).join(' · ')||esc(t.artistText||'Unknown artist')}</div><div class="full-progress"><span id="fullTime">${fmt(audio.currentTime)}</span><div class="progress" id="fullProgress"><div class="progress-fill" style="width:${audio.duration?audio.currentTime/audio.duration*100:0}%"></div></div><span id="fullDuration">${fmt(audio.duration)}</span></div><div class="full-controls"><button data-action="prev">⏮</button><button class="big" data-action="toggle-play">${audio.paused?'▶':'Ⅱ'}</button><button data-action="next">⏭</button></div><div class="full-sections"><h2>Credits</h2><div class="credits-list">${credits.slice(0,3).map(c=>`<div class="credit"><span>${esc(c.name)}</span><span>${esc(c.role)}</span></div>`).join('')||'<p>No credits yet.</p>'}</div>${credits.length>3?'<button class="btn ghost" data-action="credits" data-id="'+esc(t.id)+'">View all credits</button>':''}<h2>About the Artist</h2>${main?.bio?`<p>${esc(main.bio)}</p><button class="btn ghost" data-action="artist" data-id="${esc(main.id)}">View ${esc(main.name)}'s profile</button>`:'<p class="small-note">No artist bio has been added.</p>'}${ev.length?`<h2>Live events</h2>${ev.map(eventCard).join('')}`:''}${up.length?`<h2>Upcoming releases</h2>${up.map(r=>`<div class="event-card"><h3>${esc(r.title)}</h3><p>${r.publishAt?'Releases '+new Date(r.publishAt).toLocaleDateString():'Releasing soon'}</p></div>`).join('')}`:''}</div>`}
function deleteThing(kind,id){if(!requireOwner())return;if(!confirm('Delete this '+kind+'? This cannot be undone.'))return;if(kind==='song'){state.data.tracks=tracks().filter(t=>t.id!==id);state.data.features=arr(state.data.features).filter(f=>f.itemId!==id);state.data.playlists=arr(state.data.playlists).map(p=>({...p,trackIds:arr(p.trackIds).filter(x=>x!==id)}));if(state.queue.includes(id)){state.queue=[];state.queueIndex=-1;audio.pause()}}if(kind==='release'){state.data.releases=releases().filter(r=>r.id!==id);state.data.tracks=tracks().map(t=>t.releaseId===id?{...t,releaseId:''}:t);state.data.features=arr(state.data.features).filter(f=>f.itemId!==id)}if(kind==='artist'){state.data.artists=artists().filter(a=>a.id!==id);state.data.tracks=tracks().map(t=>({...t,artistIds:arr(t.artistIds).filter(x=>x!==id)}));state.data.releases=releases().map(r=>({...r,artistIds:arr(r.artistIds).filter(x=>x!==id)}));state.data.events=events().filter(e=>e.artistId!==id)}if(kind==='event')state.data.events=events().filter(e=>e.id!==id);if(kind==='feature')state.data.features=arr(state.data.features).filter(f=>f.id!==id);saveCloud().then(()=>{state.page=kind==='event'?'events':kind==='release'?'releases':kind==='artist'?'artists':'home';state.detail=null;render();toast('Deleted.')})}
async function exportJSON(){if(!isOwner())return;const blob=new Blob([JSON.stringify(state.data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='stephans-music-catalogue.json';a.click();URL.revokeObjectURL(a.href);toast('Catalogue export created.')}
function action(action,id,btn){switch(action){case'play':playIds([id,...publicTracks().filter(t=>t.id!==id).map(t=>t.id)]);break;case'play-artist-song':{const aid=btn.dataset.artistId;const ids=songsForArtist(aid).map(t=>t.id);const index=ids.indexOf(id);if(index>=0)playIds(ids,index);break;}case'play-release':playIds(tracks().filter(t=>t.releaseId===id).map(t=>t.id));break;case'play-list':try{playIds(JSON.parse(btn.dataset.ids||'[]'))}catch{}break;case'like':toggleLike(id);break;case'artist':go('artist',id);break;case'release':go('release',id);break;case'group':{const g=state.data.groups.find(x=>x.id===id);if(g)showModal(`<h2>${esc(g.name)}</h2><p>${esc(g.description||'Artist group')}</p><h3>Members</h3>${arr(g.memberIds).map(mid=>artistBy(mid)).filter(Boolean).map(a=>`<p><button class="link" data-action="artist" data-id="${esc(a.id)}">${esc(a.name)}</button></p>`).join('')||'<p>No members listed.</p>'}<div class="modal-actions"><button class="btn green" id="closeCredits">Done</button></div>`);if($('closeCredits'))$('closeCredits').onclick=closeModal;break}case'credits':creditsModal(trackBy(id));break;case'edit-track':editTrack(id);break;case'new-track':editTrack('',btn.dataset.release||null);break;case'edit-artist':editArtist(id);break;case'new-artist':editArtist('');break;case'edit-release':editRelease(id);break;case'new-release':editRelease('',btn.dataset.artist||null);break;case'new-event':editEvent('',btn.dataset.artist||'');break;case'delete-event':deleteThing('event',id);break;case'delete-release':deleteThing('release',id);break;case'delete-track':deleteThing('song',id);break;case'delete-artist':deleteThing('artist',id);break;case'delete-feature':deleteThing('feature',id);break;case'publish-release':{const r=releaseBy(id);if(r){r.status='published';r.publishAt='';saveCloud().then(()=>{render();toast('Release published.')})}break}case'playlist-artist':go('playlist','artistlist-'+id);break;case'playlist':go('playlist',id);break;case'new-playlist':editPlaylist('');break;case'edit-playlist':editPlaylist(id);break;case'radio-edit':editRadio(id);break;case'new-group':editGroup('');break;case'feature-artist':featureForm(id||'');break;case'home-settings':homeSettings();break;case'popular-settings':popularSettings();break;case'open-radio':openArtistRadio(id);break;case'config':configModal();break;case'login':loginModal();break;case'logout':logout();break;case'export-json':exportJSON();break;case'prev':step(-1);break;case'next':step(1);break;case'toggle-play':togglePlay();break;case'edit-event':editEvent(id);break;}}
async function logout(){if(state.client)await state.client.auth.signOut();state.session=null;state.owner=false;render();toast('Signed out.')}
document.addEventListener('click',e=>{const n=e.target.closest('#nav [data-page]');if(n){state.page=n.dataset.page;state.detail=null;render();return}});

$('openImport')?.addEventListener('click',()=>editTrack(''));$('addBtn').addEventListener('click',()=>{if(!isOwner())return;showModal(`<h2>Add to your music</h2><p>Choose what you want to create.</p><div class="tools"><button class="btn green" data-action="new-track">＋ Upload song</button><button class="btn ghost" data-action="new-release">＋ Create release</button><button class="btn ghost" data-action="new-artist">＋ Add artist</button><button class="btn ghost" data-action="new-event">＋ Live event</button><button class="btn ghost" data-action="new-playlist">＋ Playlist</button></div><div class="modal-actions"><button class="btn ghost" id="cancelModal">Close</button></div>`);$('cancelModal').onclick=closeModal});$('configBtn').onclick=configModal;$('loginBtn').onclick=()=>state.session?logout():loginModal();$('backBtn').onclick=back;$('forwardBtn').onclick=forward;$('searchInput').addEventListener('input',e=>{state.search=e.target.value;state.page='search';state.detail=null;render()});$('playBtn').onclick=togglePlay;$('prevBtn').onclick=()=>step(-1);$('nextBtn').onclick=()=>step(1);$('fullBtn').onclick=()=>{$('fullPlayer').classList.remove('hidden');renderFullPlayer()};$('closeFull').onclick=()=>$('fullPlayer').classList.add('hidden');$('fullCreditsBtn').onclick=()=>creditsModal(getCurrent());$('volume').oninput=e=>audio.volume=Number(e.target.value);audio.volume=.85;audio.addEventListener('play',updatePlayer);audio.addEventListener('pause',updatePlayer);audio.addEventListener('ended',()=>step(1));audio.addEventListener('timeupdate',()=>{const p=audio.duration?audio.currentTime/audio.duration*100:0;$('currentTime').textContent=fmt(audio.currentTime);$('duration').textContent=fmt(audio.duration);$('progressFill').style.width=p+'%';$('progressBar').setAttribute('aria-valuenow',String(Math.round(p)));if(!$('fullPlayer').classList.contains('hidden')){const f=$('fullProgress');if(f)f.querySelector('.progress-fill').style.width=p+'%';const ft=$('fullTime');const fd=$('fullDuration');if(ft)ft.textContent=fmt(audio.currentTime);if(fd)fd.textContent=fmt(audio.duration)}});function seek(e,el){if(!audio.duration)return;const r=el.getBoundingClientRect();audio.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*audio.duration}$('progressBar').onclick=e=>seek(e,$('progressBar'));$('fullMain').addEventListener('click',e=>{const p=e.target.closest('#fullProgress');if(p)seek(e,p);const b=e.target.closest('[data-action]');if(b)action(b.dataset.action,b.dataset.id,b)});$('modalBackdrop').addEventListener('click',e=>{if(e.target===$('modalBackdrop'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();$('fullPlayer').classList.add('hidden')}if(e.key==='ArrowRight'&&e.target===$('progressBar')&&audio.duration)audio.currentTime=Math.min(audio.duration,audio.currentTime+5);if(e.key==='ArrowLeft'&&e.target===$('progressBar')&&audio.duration)audio.currentTime=Math.max(0,audio.currentTime-5)});
async function boot(){try{const savedCfg=JSON.parse(localStorage.getItem('sma_config')||'null');const cfg=(HAS_BUILTIN_CONFIG?{url:DEFAULT_SUPABASE_URL,key:DEFAULT_SUPABASE_KEY}:null)||((savedCfg?.url&&savedCfg?.key)?savedCfg:null);if(cfg?.url&&cfg?.key){state.config=cfg;state.client=window.supabase.createClient(cfg.url,cfg.key);const {data:{session}}=await state.client.auth.getSession();state.session=session;await checkOwner();await loadCloud();state.client.auth.onAuthStateChange(async(_event,session)=>{state.session=session;state.owner=false;await checkOwner();await loadCloud();render()})}else demoSeed()}catch(e){console.warn(e);demoSeed()}render()}
